name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call: # chamado pelo refresh.yml (atualização de dados a cada hora)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # testes rodam com os dados versionados no repositório (estáveis)
      - run: npm test
      # partidas da Copa (usadas também como cadastro oficial de contas); se falhar, segue sem elas
      - name: Atualizar partidas
        run: node scripts/fetch-matches.mjs || echo "Partidas indisponíveis agora"
      # dados novos do DeadChaps e do EDL.gg; se as APIs falharem, mantém os dados do repositório
      - name: Atualizar dados dos jogadores
        run: node scripts/fetch-data.mjs || echo "Coleta falhou, usando os dados do repositório"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
